<style>
:root{
  --bg:#f3f1ea; --card:#ffffff; --ink:#1d1f22; --sub:#5d6168; --line:#e4e1d6;
  --accent:#f2a900; --accent-ink:#1d1f22; --hero:#26292e; --hero-ink:#ffffff;
  color-scheme: light;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121315; --card:#1d1f22; --ink:#f2f0ea; --sub:#a4a8af; --line:#2f3237;
    --hero:#0d0e10; --hero-ink:#ffffff; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121315; --card:#1d1f22; --ink:#f2f0ea; --sub:#a4a8af; --line:#2f3237;
  --hero:#0d0e10; --hero-ink:#ffffff; color-scheme: dark;
}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:20px 16px}
.card{width:100%;max-width:420px;background:var(--card);border-radius:24px;overflow:hidden;border:1px solid var(--line);align-self:flex-start}
.hero{background:#0d0e10;color:var(--hero-ink);padding:34px 26px 34px;position:relative;overflow:hidden}
.hero>*:not(.art){position:relative;z-index:1}
.art{position:absolute;right:0;top:0;width:78%;height:auto;z-index:0;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 32%);mask-image:linear-gradient(90deg,transparent 0,#000 32%)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;
  background:repeating-linear-gradient(135deg,var(--accent) 0 14px,#26292e 14px 28px)}
.btn.save{grid-column:1/-1;background:var(--ink);color:var(--card);border:0;font-family:inherit;cursor:pointer;text-decoration:none}
.badge{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12px;padding:4px 10px;border-radius:999px;margin-bottom:18px}
.company{font-size:14px;opacity:.8;margin-bottom:4px}
h1{font-size:34px;font-weight:900;letter-spacing:-.02em}
.role{margin-top:6px;font-size:15px;color:var(--accent);font-weight:500}
.body{padding:24px 22px 26px}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px 10px;border-radius:14px;font-weight:700;font-size:16px;text-decoration:none}
.btn.call{background:var(--accent);color:var(--accent-ink)}
.btn.sms{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
h2{font-size:13px;color:var(--sub);font-weight:500;margin:0 0 10px}
.services{display:grid;gap:8px;margin-bottom:22px}
.svc{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;font-weight:500}
.svc b{display:block;font-size:16px}
.svc small{color:var(--sub);font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.info{border-top:1px solid var(--line);padding-top:18px;display:grid;gap:14px}
.row{display:flex;gap:12px;font-size:15px;line-height:1.5}
.row span:first-child{color:var(--sub);width:46px;flex:none;font-size:13px;padding-top:1px}
.row a{color:var(--ink);text-decoration:none}
.map{display:block;margin-top:18px;text-align:center;padding:13px;border-radius:14px;background:var(--bg);color:var(--ink);text-decoration:none;font-weight:500;font-size:15px}
</style>
